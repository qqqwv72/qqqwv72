name: Snake
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: qqqwv72
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "snake update"
          keep_history: true
